<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Debate Case Constructor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .ai-tip { font-size: 0.8rem; color: #4f46e5; margin-top: 0.25rem; display: block; }
        
        /* Loading Spinner for the AI Button */
        .spinner {
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            width: 1rem;
            height: 1rem;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <header class="border-b pb-4 mb-6">
            <h1 class="text-3xl font-bold text-gray-900">🏛️ AI Debate Case Constructor</h1>
            <p class="text-gray-500 mt-2">Build your arguments strategically and structured with the help of AI.</p>
        </header>

        <section class="mb-8 bg-gray-100 p-6 rounded-lg border border-gray-200">
            <h2 class="text-xl font-semibold mb-4">Basic Information</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-medium mb-1">Motion</label>
                    <input type="text" id="motion" class="w-full border-gray-300 rounded-md p-2 border focus:ring-2 focus:ring-indigo-500" placeholder="e.g., This House Would ban private schooling">
                </div>
                <div>
                    <label class="block font-medium mb-1">Stance</label>
                    <select id="stance" class="w-full border-gray-300 rounded-md p-2 border focus:ring-2 focus:ring-indigo-500">
                        <option value="Government / Affirmative">Government</option>
                        <option value="Opposition / Negative">Opposition</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-4">
                <button id="ai-gen-btn" onclick="generateAIArgument()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-3 px-4 rounded shadow hover:from-indigo-700 hover:to-purple-700 transition flex items-center justify-center">
                    <span id="btn-spinner" class="spinner hidden"></span>
                    <span id="btn-text">✨ Generate Argument with AI</span>
                </button>
            </div>
        </section>

        <div id="arguments-container"></div>

        <div class="flex justify-between items-center mt-6 border-t pt-6">
            <button onclick="addArgument()" class="bg-indigo-100 text-indigo-700 font-semibold py-2 px-4 rounded hover:bg-indigo-200 transition">
                + Add Manual Argument
            </button>
            <button onclick="exportSpeech()" class="bg-green-600 text-white font-semibold py-2 px-6 rounded shadow hover:bg-green-700 transition">
                Export Speech (Text File)
            </button>
        </div>
    </div>

    <script>
        let argumentCount = 0;

        // Add a new (empty or pre-filled) argument block
        function addArgument(initialData = {}) {
            argumentCount++;
            const container = document.getElementById('arguments-container');
            
            const argDiv = document.createElement('div');
            argDiv.className = "argument-block mb-8 p-6 border-2 border-indigo-50 rounded-lg bg-white shadow-sm";
            argDiv.id = `arg-${argumentCount}`;
            
            argDiv.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-indigo-900">Argument #${argumentCount} ${initialData.isAI ? '✨ (AI Generated)' : ''}</h3>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-500 text-sm hover:underline">Delete</button>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block font-semibold">1. Claim</label>
                        <input type="text" class="arg-claim w-full border-gray-300 rounded border p-2 mt-1" 
                            placeholder="Your central point in one simple sentence..." value="${initialData.claim || ''}">
                        <span class="ai-tip">💡 AI Tip: Keep the Claim short and punchy, like a newspaper headline.</span>
                    </div>

                    <div>
                        <label class="block font-semibold">2. Why True</label>
                        <textarea class="arg-why-true w-full border-gray-300 rounded border p-2 mt-1 h-28" 
                            placeholder="Analyze the logical mechanism...">${initialData.whyTrue || ''}</textarea>
                        <span class="ai-tip">💡 AI Tip: Explain 'how' we get from point A to point B. Break it down into logical steps.</span>
                    </div>

                    <div>
                        <label class="block font-semibold">3. Why Important</label>
                        <textarea class="arg-why-important w-full border-gray-300 rounded border p-2 mt-1 h-28" 
                            placeholder="What is the impact of this argument...">${initialData.whyImportant || ''}</textarea>
                        <span class="ai-tip">💡 AI Tip: Answer the question 'So what?'. How are key stakeholders affected?</span>
                    </div>

                    <div>
                        <label class="block font-semibold">4. Examples (Optional)</label>
                        <textarea class="arg-examples w-full border-gray-300 rounded border p-2 mt-1 h-16" 
                            placeholder="Historical facts, statistics, analogies...">${initialData.examples || ''}</textarea>
                        <span class="ai-tip">💡 AI Tip: A good example makes your logical analysis easier to visualize and understand.</span>
                    </div>
                </div>
            `;
            container.appendChild(argDiv);
            
            // Smoothly scroll to the newly created argument
            argDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // Call the Puter AI API to generate an argument
        async function generateAIArgument() {
            const motion = document.getElementById('motion').value.trim();
            const stance = document.getElementById('stance').value;

            if (!motion) {
                alert("Please enter a motion first!");
                return;
            }

            // Set button to loading state
            const btnSpinner = document.getElementById('btn-spinner');
            const btnText = document.getElementById('btn-text');
            const aiBtn = document.getElementById('ai-gen-btn');
            
            btnSpinner.classList.remove('hidden');
            btnText.textContent = "AI is analyzing motion...";
            aiBtn.disabled = true;

            // Prompt asking the AI to return a JSON response in English
            const prompt = `You are a world-class debate adjudicator and debate coach. 
Analyze the following motion: "${motion}"
From the perspective of: ${stance}

Create one powerful, logically sound debate argument using the S-E-X-I model.
Respond ONLY with a valid JSON object in English, using this exact structure (do not include any markdown formatting like \`\`\`json, just the pure JSON string):
{
  "claim": "Write a short, catchy 1-sentence claim",
  "whyTrue": "Provide 3-4 sentences of deep logical mechanism explaining why this claim is true",
  "whyImportant": "Explain the impact and why this wins the debate in 2-3 sentences",
  "examples": "Give a realistic example or analogy supporting this argument"
}`;

            try {
                // Call Puter.js free Chat API
                const response = await puter.ai.chat(prompt); //
                let cleanResponse = response.message.content;
                
                // Clean any markdown wrapper formatting returned by the LLM
                cleanResponse = cleanResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const data = JSON.parse(cleanResponse);

                // Add the generated argument to the interface
                addArgument({
                    claim: data.claim,
                    whyTrue: data.whyTrue,
                    whyImportant: data.whyImportant,
                    examples: data.examples,
                    isAI: true
                });

            } catch (error) {
                console.error("AI Error:", error);
                alert("Something went wrong with the AI API. Please try again!");
            } finally {
                // Restore button state
                btnSpinner.classList.add('hidden');
                btnText.textContent = "✨ Generate Argument with AI";
                aiBtn.disabled = false;
            }
        }

        // Export all constructed arguments into a text file
        function exportSpeech() {
            const motion = document.getElementById('motion').value || '[No motion provided]';
            const stance = document.getElementById('stance').value;
            
            let exportText = `===================================\n`;
            exportText += `MOTION: ${motion}\n`;
            exportText += `STANCE: ${stance}\n`;
            exportText += `===================================\n\n`;

            const argBlocks = document.querySelectorAll('.argument-block');
            
            if (argBlocks.length === 0) {
                alert('Add at least one argument block before exporting!');
                return;
            }

            argBlocks.forEach((block, index) => {
                const claim = block.querySelector('.arg-claim').value || '[Empty]';
                const whyTrue = block.querySelector('.arg-why-true').value || '[Empty]';
                const whyImportant = block.querySelector('.arg-why-important').value || '[Empty]';
                const examples = block.querySelector('.arg-examples').value || '[No examples]';

                exportText += `ARGUMENT ${index + 1}: ${claim.toUpperCase()}\n`;
                exportText += `-----------------------------------\n`;
                exportText += `WHY TRUE (Mechanism):\n${whyTrue}\n\n`;
                exportText += `WHY IMPORTANT (Impact):\n${whyImportant}\n\n`;
                exportText += `EXAMPLES (Evidence):\n${examples}\n\n`;
                exportText += `\n`;
            });

            const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Debate_Case_AI.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Initialize with one blank argument on page load
        window.onload = () => {
            addArgument();
        };
    </script>
</body>
</html>
